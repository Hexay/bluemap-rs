[package]
name = "bm-resources"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Resource and data pack loading: blockstates, models, textures, colours, biomes"

[dependencies]
base64.workspace = true
bm-java = { workspace = true, features = ["png"] }
bm-math.workspace = true
bm-world.workspace = true
flate2.workspace = true
png.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
# variants resolve in file order, so JSON objects must keep it
serde_json = { workspace = true, features = ["preserve_order"] }
sha1.workspace = true
thiserror.workspace = true
ureq.workspace = true
zip.workspace = true
