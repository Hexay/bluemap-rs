
# How map data is laid out in this storage (bluemap-rs only, Java BlueMap ignores this setting):
#  - optimized: packed tile bundles with a compact encoding, several times smaller and faster to write.
#    The webapp works unchanged, but only bluemap-rs (or its integrated webserver) can serve this data.
#  - compat: BlueMap's original layout, also readable by Java BlueMap and external webservers (e.g. sql.php, nginx).
# Changing this value does not convert existing map data; use the "storage convert" command for that.
# If this setting is missing, compat is used (so storages created by Java BlueMap keep working).
format: optimized
