
# Optimized storages keep hires tiles packed; the webapp served from here unpacks them in the browser.
# What clients that don't (other webapps, scripts, crawlers) get (bluemap-rs only, Java BlueMap ignores this setting):
#  - limited: the server unpacks for them, a quarter of the CPU cores at most; requests that can't start within
#    half a second get "503 Service Unavailable".
#  - never: "406 Not Acceptable" (tiles the format stores unpacked are still served).
#  - always: the server unpacks every request (lets any client keep all cores busy).
# Default is limited
server-unpack: limited

# Reverse proxies (IPs or CIDR blocks) whose X-Forwarded-For or X-Real-IP names the client, so the limited queue is
# shared fairly per client, e.g. ["127.0.0.1", "::1"]. Empty: the connecting address is the client.
# Default is []
trusted-proxies: []
