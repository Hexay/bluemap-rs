
# Optimized storages keep hires tiles packed; the webapp served from here unpacks them in the browser.
# What clients that don't (other webapps, scripts, crawlers) get (bluemap-rs only, Java BlueMap ignores this setting):
#  - limited: the server unpacks for them, a quarter of the CPU cores at most; beyond that "503 Service Unavailable".
#  - never: "406 Not Acceptable" (tiles the format stores unpacked are still served).
#  - always: the server unpacks every request (lets any client keep all cores busy).
# Default is limited
server-unpack: limited
