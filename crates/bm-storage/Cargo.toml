[package]
name = "bm-storage"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "BlueMap map storages (file tree and SQL), byte-compatible with upstream"

[dependencies]
bm-compress.workspace = true
bm-format.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
twox-hash.workspace = true

[target.'cfg(windows)'.dependencies]
# the file id for stored-file versions (std's `MetadataExt::file_index` is unstable)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
