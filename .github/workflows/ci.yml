name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # same pins as release.yml
  ZIGLANG: ziglang==0.16.0
  CARGO_ZIGBUILD: cargo-zigbuild==0.23.4

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # advisories, licenses (deny.toml allow list), sources
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # the static musl cores are cross-built: catch C-dependency breakage before a release
  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$ZIGLANG" "$CARGO_ZIGBUILD"
      - run: python tools/build_core.py linux-x64
      - name: static binary runs
        run: |
          file platforms/natives/linux-x64/bluemap-core | grep -q "statically linked"
          platforms/natives/linux-x64/bluemap-core --version

  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: platforms
        run: ./gradlew test assemble --no-daemon --console=plain
