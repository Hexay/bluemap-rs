version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: /platforms
    schedule:
      interval: weekly
    # pinned to what BlueMap 5.28 and the supported MC range ship (drop-in API surface)
    ignore:
      - dependency-name: "de.bluecolored:bluemap-api"
      - dependency-name: "com.flowpowered:flow-math"
      - dependency-name: "com.google.code.gson:gson"
      - dependency-name: "com.mojang:*"
      - dependency-name: "io.papermc.paper:paper-api"
      - dependency-name: "net.fabricmc*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
