[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"
rust-version = "1.94"
publish = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# release optimisation without the LTO/single-CGU link, for iterating on tests; ship and bench with release
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16

# release code + full debug info so samply can name functions
[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service"] }
notify = "8"
percent-encoding = "2"
# debug-embed: debug builds embed too, so tests serve exactly what release ships
rust-embed = { version = "8", features = ["debug-embed"] }
socket2 = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic", "limit", "timeout"] }
tracing = "0.1"
# global allocator of the static musl cores only (bm-cli); see docs/13 §5
mimalloc = { version = "0.1", default-features = false }
clap = { version = "4", features = ["derive"] }
# zlib-rs: pure-Rust backend, faster than miniz_oxide
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# gzip/zlib encode only (decode stays on flate2: multi-member gzip, output caps); small C build via cc
libdeflater = "1"
# lz4-java block framing only needs the raw block API; checked-decode turns malformed input into errors
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
png = "0.18"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
# TLS: rustls on ring with webpki roots — no OpenSSL, so Linux builds can be static musl; aws-lc needs CMake on
# Windows. macros/migrate/any unused. >= 0.9: 0.8's TLS adapter could deadlock a large write (sql_remote
# `tls_large_writes`). mysql-rsa: caching_sha2_password logins without TLS (MySQL 8 default), as 0.8 had built in
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "mysql", "mysql-rsa", "postgres", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash32"] }
# `rustls` = rustls on ring with webpki roots, as for sqlx
ureq = { version = "3", default-features = false, features = ["rustls"] }
zstd = "0.14"
# deflate via flate2 only: the default features pull C builds (bzip2, zstd) and crypto we don't need
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
bm-compress = { path = "crates/bm-compress" }
bm-config = { path = "crates/bm-config" }
bm-engine = { path = "crates/bm-engine" }
bm-format = { path = "crates/bm-format" }
bm-ipc = { path = "crates/bm-ipc" }
bm-java = { path = "crates/bm-java" }
bm-map = { path = "crates/bm-map" }
bm-math = { path = "crates/bm-math" }
bm-nbt = { path = "crates/bm-nbt" }
bm-render = { path = "crates/bm-render" }
bm-resources = { path = "crates/bm-resources" }
bm-storage = { path = "crates/bm-storage" }
bm-web = { path = "crates/bm-web" }
bm-world = { path = "crates/bm-world" }
