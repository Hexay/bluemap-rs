[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"
publish = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# release code + full debug info so samply can name functions
[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
gethostname = "1"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service"] }
percent-encoding = "2"
# debug-embed: debug builds embed too, so tests serve exactly what release ships
rust-embed = { version = "8", features = ["debug-embed"] }
socket2 = "0.6"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout"] }
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
# zlib-rs: pure-Rust backend, faster than miniz_oxide
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# lz4-java block framing only needs the raw block API; checked-decode turns malformed input into errors
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
png = "0.18"
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
# native-tls (schannel on Windows): rustls pulls aws-lc/ring C builds; macros/migrate/any unused
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-native-tls", "mysql", "postgres", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
twox-hash = { version = "2.1", default-features = false, features = ["xxhash32"] }
# native-tls: rustls' default aws-lc backend needs CMake on Windows
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zstd = "0.13"
# deflate via flate2 only: the default features pull C builds (bzip2, zstd) and crypto we don't need
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
bm-compress = { path = "crates/bm-compress" }
bm-config = { path = "crates/bm-config" }
bm-format = { path = "crates/bm-format" }
bm-java = { path = "crates/bm-java" }
bm-map = { path = "crates/bm-map" }
bm-math = { path = "crates/bm-math" }
bm-nbt = { path = "crates/bm-nbt" }
bm-resources = { path = "crates/bm-resources" }
bm-storage = { path = "crates/bm-storage" }
bm-web = { path = "crates/bm-web" }
bm-world = { path = "crates/bm-world" }
